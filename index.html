<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Méta-données de base pour le navigateur -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Le titre qui s'affiche dans l'onglet du navigateur -->
    <title>Sim life</title>

    <!-- On relie notre fichier de style (CSS) à notre page HTML -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Le titre principal de la page -->
    <h1>Sim life</h1>

    <!-- Le canvas est la zone où nous allons dessiner notre jeu.
         Il a une largeur (width) de 800 pixels et une hauteur (height) de 600 pixels. -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- On relie notre fichier de logique (JavaScript) à notre page HTML.
         On le place à la fin du 'body' pour s'assurer que la page a fini de charger avant de lancer le jeu. -->
    <script src="script.js"></script>
</body>
</html>
